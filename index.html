<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mi Presupuesto Diario & Historial</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>

    :root {

      --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8;

      --primary: #38bdf8; --success: #10b981; --warning: #f59e0b; --danger: #ef4444;

      --border: #334155;

    }

    * { box-sizing: border-box; }

    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px; display: flex; justify-content: center; }

    .container { width: 100%; max-width: 480px; }

    

    /* Navigation */

    .nav { display: flex; gap: 6px; margin-bottom: 16px; background: var(--card); padding: 5px; border-radius: 12px; }

    .nav button { flex: 1; padding: 10px 4px; border: none; background: transparent; color: var(--muted); font-weight: 600; font-size: 0.82rem; border-radius: 8px; cursor: pointer; transition: 0.2s; }

    .nav button.active { background: #334155; color: var(--primary); }

    

    .card { background: var(--card); border-radius: 16px; padding: 18px; margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.25); }

    

    /* Header Balance */

    .budget-header { text-align: center; }

    .budget-title { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

    .budget-amount { font-size: 2.3rem; font-weight: 800; color: var(--success); margin: 4px 0; }

    .budget-amount.negative { color: var(--danger); }

    .budget-sub { font-size: 0.8rem; color: var(--muted); display: flex; justify-content: space-around; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }

    

    /* Form */

    label { font-size: 0.82rem; color: var(--muted); margin-bottom: 6px; display: block; font-weight: 500; }

    input[type="number"], input[type="date"], select { width: 100%; font-size: 1rem; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); margin-bottom: 14px; }

    input[type="number"] { font-size: 2rem; text-align: center; color: var(--primary); font-weight: bold; padding: 10px; }

    

    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px; }

    .cat-btn { background: #334155; border: 2px solid transparent; color: var(--text); padding: 11px 6px; border-radius: 10px; font-size: 0.85rem; font-weight: 500; cursor: pointer; transition: 0.15s; }

    .cat-btn.active { border-color: var(--primary); background: #0284c7; }

    

    .save-btn { width: 100%; background: var(--success); border: none; color: white; padding: 14px; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; }

    .save-btn:disabled { background: #475569; }

    #msg { text-align: center; margin-top: 10px; font-size: 0.85rem; min-height: 20px; }



    /* Tabs */

    .tab-content { display: none; }

    .tab-content.active { display: block; }

    .chart-container { position: relative; margin-bottom: 20px; }



    /* Desglose Diario UI */

    .day-card { background: #0f172a; border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid var(--border); }

    .day-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 8px; margin-bottom: 8px; }

    .day-date { font-weight: 700; font-size: 0.95rem; color: var(--primary); }

    .day-total { font-weight: 800; font-size: 0.95rem; }

    .day-status-pill { font-size: 0.72rem; padding: 3px 7px; border-radius: 20px; font-weight: 600; }

    .status-ok { background: rgba(16, 185, 129, 0.2); color: #34d399; }

    .status-over { background: rgba(239, 68, 68, 0.2); color: #f87171; }

    

    .tx-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 0.85rem; border-bottom: 1px dashed #1e293b; }

    .tx-item:last-child { border-bottom: none; }

    .tx-cat { display: flex; align-items: center; gap: 6px; }

    .tx-time { font-size: 0.75rem; color: var(--muted); }

    .tx-monto { font-weight: 600; color: #f8fafc; }



    .empty-state { text-align: center; padding: 30px 10px; color: var(--muted); font-size: 0.9rem; }

    .sync-btn { background: #334155; border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; font-size: 0.75rem; cursor: pointer; float: right; margin-bottom: 8px; }

  </style>

</head>

<body>



<div class="container">

  <!-- NAV TABS -->

  <div class="nav">

    <button class="active" onclick="switchTab('registro')">💸 Registrar</button>

    <button onclick="switchTab('desglose')">📅 Por Día</button>

    <button onclick="switchTab('dashboard')">📊 Métricas</button>

  </div>



  <!-- TAB 1: REGISTRO & SALDO HOY -->

  <div id="tab-registro" class="tab-content active">

    <div class="card budget-header">

      <div class="budget-title">Disponible para gastar hoy</div>

      <div class="budget-amount" id="disp-hoy">S/ 50.00</div>

      <div class="budget-sub">

        <div>Gastado este mes:<br><strong id="total-mes" style="color:var(--text)">S/ 0.00</strong></div>

        <div>Ahorro acumulado mes:<br><strong id="ahorro-mes" style="color:var(--success)">S/ 0.00</strong></div>

      </div>

    </div>



    <div class="card">

      <label>Monto del gasto (Soles)</label>

      <input type="number" id="monto" inputmode="decimal" placeholder="0.00" step="any">



      <label>Categoría</label>

      <div class="grid">

        <button class="cat-btn" onclick="selectCat(this, 'Comida')">🍔 Comida</button>

        <button class="cat-btn" onclick="selectCat(this, 'Taxi')">🚕 Taxi</button>

        <button class="cat-btn" onclick="selectCat(this, 'Transporte público')">🚌 Transp. Público</button>

        <button class="cat-btn" onclick="selectCat(this, 'Trabajo')">💼 Trabajo</button>

        <button class="cat-btn" onclick="selectCat(this, 'Ropa')">👕 Ropa</button>

        <button class="cat-btn" onclick="selectCat(this, 'Salidas')">🎉 Salidas</button>

        <button class="cat-btn" style="grid-column: span 2;" onclick="selectCat(this, 'Regalos')">🎁 Regalos</button>

      </div>



      <button class="save-btn" id="submit-btn" onclick="enviarGasto()">Guardar Gasto</button>

      <div id="msg"></div>

    </div>

  </div>



  <!-- TAB 2: DESGLOSE DIARIO -->

  <div id="tab-desglose" class="tab-content">

    <div class="card">

      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">

        <h3 style="margin:0; font-size:1.05rem;">📅 Desglose por Día</h3>

        <button class="sync-btn" onclick="loadData()">🔄 Sincronizar</button>

      </div>

      

      <label>Seleccionar Mes a Consultar</label>

      <select id="desglose-month-selector" onchange="renderDesgloseDiario()"></select>

      

      <div id="desglose-container">

        <!-- Render dinámico de días y transacciones -->

      </div>

    </div>

  </div>



  <!-- TAB 3: DASHBOARD HISTÓRICO -->

  <div id="tab-dashboard" class="tab-content">

    <div class="card">

      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">

        <h3 style="margin:0; font-size:1.05rem;">📊 Dashboard Mensual</h3>

        <button class="sync-btn" onclick="loadData()">🔄 Actualizar</button>

      </div>



      <label>Seleccionar Mes</label>

      <select id="month-selector" onchange="renderCharts()"></select>



      <div class="budget-sub" style="margin-top:0; border:none; margin-bottom:14px;">

        <div>Gastado en el mes:<br><strong id="dash-gastado" style="color:var(--primary); font-size:1.1rem;">S/ 0.00</strong></div>

        <div>Ahorro final del mes:<br><strong id="dash-ahorro" style="color:var(--success); font-size:1.1rem;">S/ 0.00</strong></div>

      </div>



      <div class="chart-container">

        <canvas id="catChart"></canvas>

      </div>

      <div class="chart-container">

        <canvas id="dayChart"></canvas>

      </div>

    </div>

  </div>

</div>



<script>

  // REEMPLAZA CON TU URL DE GOOGLE APPS SCRIPT

  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby2PlJJlIZERP_m6P9gQ5pggwyw86VxHtFzUng_EyTOV9fyamZ7wDRuTas6pMMWF_4/exec";



  const catIcons = {

    'Comida': '🍔',

    'Taxi': '🚕',

    'Transporte público': '🚌',

    'Trabajo': '💼',

    'Ropa': '👕',

    'Salidas': '🎉',

    'Regalos': '🎁'

  };



  let allGastos = JSON.parse(localStorage.getItem('gastos_cache') || '[]');

  let selectedCategory = "";

  let catChartInstance = null;

  let dayChartInstance = null;



  function switchTab(tab) {

    document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));

    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

    if (tab === 'registro') {

      document.querySelector('.nav button:nth-child(1)').classList.add('active');

      document.getElementById('tab-registro').classList.add('active');

    } else if (tab === 'desglose') {

      document.querySelector('.nav button:nth-child(2)').classList.add('active');

      document.getElementById('tab-desglose').classList.add('active');

      renderDesgloseDiario();

    } else {

      document.querySelector('.nav button:nth-child(3)').classList.add('active');

      document.getElementById('tab-dashboard').classList.add('active');

      renderCharts();

    }

  }



  function selectCat(btn, cat) {

    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));

    btn.classList.add('active');

    selectedCategory = cat;

  }



  async function loadData() {

    try {

      const res = await fetch(SCRIPT_URL, { method: "GET", redirect: "follow" });

      const data = await res.json();

      if (Array.isArray(data)) {

        allGastos = data;

        localStorage.setItem('gastos_cache', JSON.stringify(data));

        calcularPresupuesto();

        populateMonthSelectors();

        renderDesgloseDiario();

        if (document.getElementById('tab-dashboard').classList.contains('active')) {

          renderCharts();

        }

      }

    } catch (e) {

      console.warn("Usando datos locales en caché:", e);

      calcularPresupuesto();

      populateMonthSelectors();

      renderDesgloseDiario();

    }

  }



  function calcularPresupuesto() {

    const now = new Date();

    const currentYear = now.getFullYear();

    const currentMonth = now.getMonth();

    const currentDay = now.getDate();



    const gastosMesActual = allGastos.filter(g => {

      const d = new Date(g.fecha);

      return d.getFullYear() === currentYear && d.getMonth() === currentMonth;

    });



    const totalGastadoMes = gastosMesActual.reduce((acc, g) => acc + Number(g.monto), 0);

    const presupuestoPermitidoHastaHoy = currentDay * 50;

    const disponibleHoy = presupuestoPermitidoHastaHoy - totalGastadoMes;

    const ahorroActual = presupuestoPermitidoHastaHoy - totalGastadoMes;



    const dispEl = document.getElementById('disp-hoy');

    dispEl.innerText = `S/ ${disponibleHoy.toFixed(2)}`;

    dispEl.className = disponibleHoy >= 0 ? 'budget-amount' : 'budget-amount negative';



    document.getElementById('total-mes').innerText = `S/ ${totalGastadoMes.toFixed(2)}`;

    document.getElementById('ahorro-mes').innerText = `S/ ${Math.max(0, ahorroActual).toFixed(2)}`;

  }



  function populateMonthSelectors() {

    const selectorDash = document.getElementById('month-selector');

    const selectorDesglose = document.getElementById('desglose-month-selector');

    const months = {};

    

    allGastos.forEach(g => {

      const d = new Date(g.fecha);

      if (!isNaN(d.getTime())) {

        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;

        months[key] = d.toLocaleString('es-ES', { month: 'long', year: 'numeric' });

      }

    });



    const now = new Date();

    const currentKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

    months[currentKey] = now.toLocaleString('es-ES', { month: 'long', year: 'numeric' });



    const sortedKeys = Object.keys(months).sort().reverse();



    [selectorDash, selectorDesglose].forEach(sel => {

      const currentVal = sel.value;

      sel.innerHTML = '';

      sortedKeys.forEach(k => {

        const opt = document.createElement('option');

        opt.value = k;

        opt.innerText = months[k].toUpperCase();

        sel.appendChild(opt);

      });

      if (currentVal && sortedKeys.includes(currentVal)) {

        sel.value = currentVal;

      }

    });

  }



  function renderDesgloseDiario() {

    const container = document.getElementById('desglose-container');

    const selector = document.getElementById('desglose-month-selector');

    if (!selector.value) return;



    const [year, month] = selector.value.split('-').map(Number);

    const filtered = allGastos.filter(g => {

      const d = new Date(g.fecha);

      return d.getFullYear() === year && (d.getMonth() + 1) === month;

    });



    if (filtered.length === 0) {

      container.innerHTML = '<div class="empty-state">No hay gastos registrados en este mes.</div>';

      return;

    }



    // Agrupar por día (orden descendente: del día más reciente al más antiguo)

    const grouped = {};

    filtered.forEach(g => {

      const d = new Date(g.fecha);

      const dayKey = d.getDate();

      if (!grouped[dayKey]) {

        grouped[dayKey] = {

          dateObj: d,

          total: 0,

          items: []

        };

      }

      grouped[dayKey].total += Number(g.monto);

      grouped[dayKey].items.push(g);

    });



    const sortedDays = Object.keys(grouped).map(Number).sort((a, b) => b - a);



    let html = '';

    sortedDays.forEach(day => {

      const group = grouped[day];

      const dateFormatted = group.dateObj.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });

      const isOver = group.total > 50;

      const statusBadge = isOver 

        ? `<span class="day-status-pill status-over">+S/ ${(group.total - 50).toFixed(2)} sobre meta</span>`

        : `<span class="day-status-pill status-ok">Ahorro: S/ ${(50 - group.total).toFixed(2)}</span>`;



      html += `

        <div class="day-card">

          <div class="day-header">

            <div>

              <span class="day-date">${dateFormatted.toUpperCase()}</span>

              <div style="margin-top:2px;">${statusBadge}</div>

            </div>

            <div style="text-align:right;">

              <span class="day-total" style="color:${isOver ? 'var(--danger)' : 'var(--text)'}">S/ ${group.total.toFixed(2)}</span>

            </div>

          </div>

          <div class="tx-list">

      `;



      // Render de items de ese día

      group.items.forEach(item => {

        const d = new Date(item.fecha);

        const timeFormatted = isNaN(d.getTime()) ? '' : d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });

        const icon = catIcons[item.categoria] || '📌';



        html += `

          <div class="tx-item">

            <div class="tx-cat">

              <span>${icon}</span>

              <div>

                <strong>${item.categoria}</strong>

                ${timeFormatted ? `<div class="tx-time">${timeFormatted}</div>` : ''}

              </div>

            </div>

            <div class="tx-monto">S/ ${Number(item.monto).toFixed(2)}</div>

          </div>

        `;

      });



      html += `</div></div>`;

    });



    container.innerHTML = html;

  }



  function renderCharts() {

    const selector = document.getElementById('month-selector');

    if (!selector.value) return;



    const [year, month] = selector.value.split('-').map(Number);

    const filtered = allGastos.filter(g => {

      const d = new Date(g.fecha);

      return d.getFullYear() === year && (d.getMonth() + 1) === month;

    });



    const totalGasto = filtered.reduce((acc, g) => acc + Number(g.monto), 0);

    const daysInMonth = new Date(year, month, 0).getDate();

    const presupuestoTotalMes = daysInMonth * 50;

    const ahorroMes = Math.max(0, presupuestoTotalMes - totalGasto);



    document.getElementById('dash-gastado').innerText = `S/ ${totalGasto.toFixed(2)}`;

    document.getElementById('dash-ahorro').innerText = `S/ ${ahorroMes.toFixed(2)}`;



    const cats = {};

    filtered.forEach(g => {

      cats[g.categoria] = (cats[g.categoria] || 0) + Number(g.monto);

    });



    const daily = {};

    filtered.forEach(g => {

      const day = new Date(g.fecha).getDate();

      daily[day] = (daily[day] || 0) + Number(g.monto);

    });



    if (catChartInstance) catChartInstance.destroy();

    if (dayChartInstance) dayChartInstance.destroy();



    const ctxCat = document.getElementById('catChart').getContext('2d');

    catChartInstance = new Chart(ctxCat, {

      type: 'doughnut',

      data: {

        labels: Object.keys(cats),

        datasets: [{

          data: Object.values(cats),

          backgroundColor: ['#38bdf8', '#10b981', '#f59e0b', '#ef4444', '#a855f7', '#ec4899', '#64748b']

        }]

      },

      options: { plugins: { title: { display: true, text: 'Distribución por Categorías', color: '#f8fafc' }, legend: { labels: { color: '#94a3b8' } } } }

    });



    const daysLabels = Array.from({ length: daysInMonth }, (_, i) => i + 1);

    const dayData = daysLabels.map(d => daily[d] || 0);



    const ctxDay = document.getElementById('dayChart').getContext('2d');

    dayChartInstance = new Chart(ctxDay, {

      type: 'bar',

      data: {

        labels: daysLabels,

        datasets: [

          { label: 'Gasto Diario (S/)', data: dayData, backgroundColor: '#38bdf8' },

          { label: 'Meta Diaria (S/ 50)', data: Array(daysInMonth).fill(50), type: 'line', borderColor: '#f59e0b', borderDash: [4, 4], fill: false }

        ]

      },

      options: {

        scales: {

          x: { ticks: { color: '#94a3b8' } },

          y: { ticks: { color: '#94a3b8' } }

        },

        plugins: { title: { display: true, text: 'Gastos Diarios vs Meta (S/ 50)', color: '#f8fafc' }, legend: { labels: { color: '#94a3b8' } } }

      }

    });

  }



  async function enviarGasto() {

    const monto = document.getElementById('monto').value;

    const msg = document.getElementById('msg');

    const btn = document.getElementById('submit-btn');



    if (!monto || Number(monto) <= 0) {

      msg.style.color = "#ef4444";

      msg.innerText = "Ingresa un monto válido.";

      return;

    }

    if (!selectedCategory) {

      msg.style.color = "#ef4444";

      msg.innerText = "Selecciona una categoría.";

      return;

    }



    btn.disabled = true;

    msg.style.color = "#94a3b8";

    msg.innerText = "Guardando en Google Sheets...";



    try {

      await fetch(SCRIPT_URL, {

        method: "POST",

        mode: "no-cors",

        headers: { "Content-Type": "application/json" },

        body: JSON.stringify({ monto: monto, categoria: selectedCategory })

      });



      const nuevoGasto = { fecha: new Date().toISOString(), monto: Number(monto), categoria: selectedCategory };

      allGastos.push(nuevoGasto);

      localStorage.setItem('gastos_cache', JSON.stringify(allGastos));

      

      calcularPresupuesto();

      populateMonthSelectors();

      renderDesgloseDiario();



      msg.style.color = "#10b981";

      msg.innerText = "¡Gasto guardado con éxito! ✅";

      document.getElementById('monto').value = "";

      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));

      selectedCategory = "";

    } catch (err) {

      msg.style.color = "#ef4444";

      msg.innerText = "Error al conectar con Sheets.";

    } finally {

      btn.disabled = false;

      setTimeout(() => { if (msg.innerText.includes("éxito")) msg.innerText = ""; }, 3000);

    }

  }



  // Inicialización

  calcularPresupuesto();

  loadData();

</script>

</body>

</html>
